services:
  dashboard:
    build:
      context: .
      args:
        # Set to false to hide User Stories (needs a rebuild).
        VITE_ADO_STORIES: ${VITE_ADO_STORIES:-true}
    image: developer-dashboard
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    environment:
      # One bridge service (ado-bridge) published on the host serves both: its
      # Notion routes live under /notion.
      NOTION_BRIDGE_URL: ${NOTION_BRIDGE_URL:-http://host.docker.internal:8000/notion}
      ADO_BRIDGE_URL: ${ADO_BRIDGE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      # Makes host.docker.internal work on Linux too (built in on Docker Desktop).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
